{% extends "base.html" %}

{% block title %}{{ error_title }} — Roadly{% endblock %}

{% block content %}
<section class="error-page">
    <span class="error-code">{{ error_code }}</span>
    <h1>{{ error_title }}</h1>
    <p>{{ error_message }}</p>
    <div class="error-actions">
        <a class="primary-btn" href="/dashboard">В личный кабинет</a>
        <a class="ghost-btn" href="/">На главную</a>
    </div>
</section>
{% endblock %}
