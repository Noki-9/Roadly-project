<header class="site-header">
    <a class="logo" href="/" aria-label="Roadly — на главную">
        <span class="logo-mark">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M6 18V7h5a3.5 3.5 0 0 1 0 7H6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M10.5 14 16 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
        </span>
        <span class="logo-text">Roadly</span>
    </a>

    <nav class="header-nav" aria-label="Основная навигация">
        {% if current_user %}
        <a class="nav-link" href="/#generator">Генератор</a>
        <a class="nav-link" href="/dashboard">Мои roadmap</a>
        {% else %}
        <a class="nav-link" href="/#how">Как это работает</a>
        <a class="nav-link" href="/#generator">Генератор</a>
        {% endif %}
    </nav>

    <div class="header-actions">
        {% if current_user %}
        <a class="header-user" href="/dashboard" title="{{ current_user.email }}" aria-label="Личный кабинет: {{ current_user.email }}">
            <span class="header-user-dot" aria-hidden="true"></span>
            <span class="header-user-email">{{ current_user.email }}</span>
        </a>
        <form method="post" action="/logout" class="inline-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button class="icon-btn" type="submit" title="Выйти" aria-label="Выйти из аккаунта">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M14.5 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6.5a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                    <path d="M10 12h9m0 0-3-3m3 3-3 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </form>
        {% else %}
        <a class="nav-link header-login" href="/login">Войти</a>
        {% endif %}

        <button class="icon-btn" id="themeToggle" type="button" aria-label="Переключить тему" title="Переключить тему">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
                <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>
</header>
